<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>GoWords Pro Checkout</title>
  <!-- Подключение Paddle.js -->
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">

  <h2>Активация подписки GoWords Pro</h2>
  <p>Нажмите кнопку ниже для безопасной оплаты:</p>
  
  <button id="pay-button" style="padding: 12px 24px; font-size: 16px; cursor: pointer; background: #0070f3; color: white; border: none; border-radius: 8px;">
    Купить подписку
  </button>

  <script>
    // 1. Читаем параметры из URL: ?userId=...&email=...
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');
    const customerEmail = urlParams.get('email');

    // 2. Инициализируем Paddle
    Paddle.Environment.set("sandbox");
    Paddle.Initialize({ 
      token: "test_3ea1711e3c54c2aa322b4c373b6" 
    });

    // 3. Открываем чекаут по клику
    document.getElementById('pay-button').addEventListener('click', () => {
      const checkoutOptions = {
        items: [
          { 
            priceId: "pri_01m0mwe5n2zq0btc69bch5xxqw", 
            quantity: 1 
          }
        ],
        settings: {
          displayMode: "overlay",
          theme: "light"
        }
      };

      // Передаем email (если он есть в URL)
      if (customerEmail) {
        checkoutOptions.customer = { email: customerEmail };
      }

      // Передаем userId в customData (попадает в webhook payload)
      if (userId) {
        checkoutOptions.customData = {
          userId: userId
        };
      }

      Paddle.Checkout.open(checkoutOptions);
    });
  </script>
</body>
</html>
